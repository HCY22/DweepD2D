; Dweep Direct2D / XAudio2 settings
[Display]
; fullscreen = borderless window covering the monitor (4:3 image, black bars)
; window     = normal window
Mode=fullscreen
; window size = 640x480 times this number (window mode only)
WindowScale=2
; sharp   = crisp pixels, evenly sized (recommended)
; nearest = crisp pixels, may be uneven at non-integer scales
; linear  = smooth / soft
; integer = whole-number scale only (bigger black border, perfectly even pixels)
Filter=sharp
; keep    = keep the 4:3 shape (black bars on wide screens)
; stretch = fill the whole screen/window (image gets wider, no black bars)
Aspect=keep
; 1 = wait for the monitor refresh (no tearing, may slow the game), 0 = off
VSync=0

; ---- Dweep_D2D.exe only (DWGFX.dll: Direct2D / DirectWrite drawing layer) ----
[Render]
; internal resolution = 640x480 times this number; auto = enough for the monitor
Scale=auto
; 0 = off (GPU only, fastest), 1 = also run the original CPU drawing and compare whole frames,
; 2 = also every drawing call (slow, forces Scale 1). F11 shows the CPU image only when Verify is 1 or 2
Verify=0
; 0 = show the original CPU drawing (like DDraw.dll)
Gpu=1

[Input]
; mouse speed: auto = like the original 640x480 full screen (one mouse step = one game pixel)
; 1 = Windows cursor speed on the scaled-up screen (slower when the game is big), or any multiplier such as 1.5
MouseSpeed=auto
